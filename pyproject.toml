[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-motion-graphics-generator"
version = "0.6.2"
description = "AI motion graphics generator — pipeline desktop tool for turning text, storyboards, and reference clips into rendered motion graphics."
requires-python = ">=3.11"
authors = [{ name = "ai-motion-graphics-generator contributors" }]
readme = "CONTRIBUTING.md"
license = { text = "MIT" }

[project.scripts]
amg = "bootstrap.cli:app"
amg-gui = "bootstrap.app:main"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["renders", "cache", "models/weights"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["models", "utils", "processors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"